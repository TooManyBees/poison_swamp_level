<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body>
  {% for p in paragraphs -%}
  <p>{{ p }}</p>
  {% endfor %}

  {%- if links -%}
  <nav>
    <p>See also:</p>
    {% for l in links -%}
    <p><a href="{{ l.path }}">{{ l.text }}</a></p>
    {% endfor %}
  </nav>
  {%- endif %}
</body>
</html>
