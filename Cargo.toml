[package]
name = "poison_swamp_level"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
anstyle = "1.0.14"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "kv"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"]}
hyper-util = { version = "0.1.20", features = ["http1", "server", "tokio"] }
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
log = { version = "0.4", features = ["kv"] }
maxminddb = { version = "0.30", features = ["mmap"] }
rand = "0.10"
rand_seeder = "0.5.0"
serde = "1"
serde_json = "1"
tokio = { version = "1.53", features = ["rt", "net", "macros", "signal"] }
upon = { version = "0.11", default-features = false, features = ["functions", "unicode"] }

[dev-dependencies]
criterion = "0.8.2"
pretty_assertions = "1.4.1"

[[bench]]
name = "markov_generator"
harness = false
